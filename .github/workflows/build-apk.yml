name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل الملفات
        uses: actions/checkout@v4

      - name: فك المشروع
        run: |
          mkdir project
          unzip -q NumberInjectorAndroid_cloud.zip -d project

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Android
        uses: android-actions/setup-android@v3

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بناء APK
        run: gradle -p project assembleDebug

      - name: حفظ APK
        uses: actions/upload-artifact@v4
        with:
          name: NumberInjector-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
